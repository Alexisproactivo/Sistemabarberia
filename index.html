<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0d0f12" />
    <meta name="color-scheme" content="dark" />
    <title>Studio Capilar · Peluquería & Barbería de Precisión</title>
    <meta
      name="description"
      content="Studio Capilar en Arequipa: Peluquería y barbería de precisión. Cortes de autor, perfilado de barba, colorimetría y tratamientos capilares. Reserva tu cita online 24/7 sin esperas."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Redes Sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Studio Capilar · Peluquería & Barbería de Precisión" />
    <meta
      property="og:description"
      content="Cortes de autor, estilo profesional y reserva de citas en línea al instante. Descubre el arte de la precisión capilar."
    />
    <meta property="og:locale" content="es_PE" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Tipografía Editorial Prémium -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Marcado Estructurado JSON-LD (SEO Local para BeautySalon / HairSalon / BarberShop) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["HairSalon", "BarberShop", "BeautySalon"],
        "name": "Studio Capilar",
        "alternateName": "Studio Capilar Peluquería & Barbería",
        "description": "Peluquería y barbería de precisión en Arequipa. Cortes de autor, diseño de barba, colorimetría y tratamientos capilares avanzados.",
        "image": "https://images.unsplash.com/photo-1585747860715-2ba37e788b70?auto=format&fit=crop&w=1200&q=80",
        "telephone": "+51999999999",
        "priceRange": "S/ 25 - S/ 150",
        "currenciesAccepted": "PEN",
        "paymentAccepted": "Efectivo, Tarjeta, Yape, Plin, Transferencia",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Av. Ejemplo 123",
          "addressLocality": "Arequipa",
          "addressRegion": "Arequipa",
          "addressCountry": "PE"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": -16.409047,
          "longitude": -71.537451
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday",
              "Sunday"
            ],
            "opens": "09:00",
            "closes": "20:00"
          }
        ],
        "acceptsReservations": "True",
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Servicios de Peluquería y Barbería",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Corte de Precisión & Barbería"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Tratamientos Capilares & Color"
              }
            }
          ]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
